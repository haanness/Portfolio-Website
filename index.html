<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Portfolio Drawing Board</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <style>
      @font-face {
        font-family: 'AUTHENTICSans-130';
        src: url('authentic/AUTHENTICSans-130.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
      }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #fff;
        position: relative;
      }

      body {
        font-family: 'AUTHENTICSans-130', sans-serif;
      }

      .page-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .page-content .spacer {
        flex: 1;
      }

      * {
        font-family: 'AUTHENTICSans-130', sans-serif !important;
      }

      .canvas-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1;
        pointer-events: none;
      }

      .canvas-layer canvas {
        width: 100%;
        display: block;
      }

      nav {
        background-color: transparent;
        padding: .72rem 0;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
      }

      footer {
        background-color: transparent;
        padding: 1.2rem 3rem;
        position: relative;
        z-index: 10;
      }

      .footer-inner {
        max-width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        font-size: 14px;
        color: #00906A;
      }

      .footer-inner a {
        color: #00906A;
        text-decoration: none;
        transition: color 0.2s;
      }

      .footer-inner a:hover {
        color: #006d55;
        text-decoration: underline;
      }

      .footer-links {
        display: flex;
        gap: 1.5rem;
        align-items: center;
        flex-wrap: wrap;
      }

      @media (max-width: 600px) {
        footer {
          padding: 1rem 1.5rem;
        }
        .footer-inner {
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 0.5rem;
        }
        .footer-links {
          justify-content: center;
        }
      }

      .tools-board {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: auto;
        padding: 0;
        background: transparent;
        border-radius: 0;
        z-index: 1001;
      }

      .tools-board .row {
        margin-bottom: 0;
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
      }

      .clear-canvas,
      .save-drawing {
        cursor: pointer !important;
        padding: 4px 6px !important;
        border-radius: 4px !important;
        font-size: 18px !important;
        font-weight: 400 !important;
        transition: all 0.3s !important;
        border: none !important;
        outline: none !important;
        white-space: nowrap !important;
      }

      .clear-canvas {
        background: #ffffff !important;
        color: #00906A !important;
        outline: 2px solid #00906A !important;
        outline-offset: -2px !important;
      }

      .save-drawing {
        background: #00906A !important;
        color: #fff !important;
      }

      .clear-canvas:hover {
        background: #f0faf7 !important;
      }

      .save-drawing:hover {
        background: #006d55 !important;
      }

      .page-content .container {
        max-width: 100%;
        margin: 0;
        padding: 0;
        width: 100%;
      }

      .page-content .nav-container {
        max-width: 100%;
        padding: 0.1rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .page-content .logo {
        color: #00906A;
        font-size: 18px;
        font-weight: 500;
        white-space: nowrap;
      }

      .page-content .nav-links {
        display: flex;
        list-style: none;
        gap: 1.5rem;
        align-items: center;
      }

      .page-content .nav-links li {
        display: flex;
        align-items: center;
      }

      .page-content .nav-links a {
        color: #00906A;
        text-decoration: none;
        transition: text-decoration 0.2s;
        font-size: 18px;
        font-weight: 400;
      }

      .page-content .nav-links a:hover {
        color: #00906A;
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 2px;
      }

      .page-content .nav-links .lang-switcher a:hover {
        text-decoration: none;
      }

      .nav-right {
        display: none;
        align-items: center;
        gap: 1rem;
      }

      .sun-icon-desktop {
        display: block;
      }

      .hamburger {
        display: none;
        flex-direction: column;
        cursor: pointer;
        gap: 4px;
      }

      .hamburger span {
        width: 25px;
        height: 3px;
        background: #00906A;
        transition: 0.3s;
      }

      .hamburger.active span:nth-child(1) {
        transform: rotate(-45deg) translate(-5px, 5px);
      }

      .hamburger.active span:nth-child(2) {
        opacity: 0;
      }

      .hamburger.active span:nth-child(3) {
        transform: rotate(45deg) translate(-5px, -5px);
      }

      @media (max-width: 768px) {
        .hamburger {
          display: flex;
        }

        .nav-right {
          display: flex;
        }

        .sun-icon-desktop {
          display: none;
        }

        .page-content .nav-links {
          position: fixed;
          top: 80px;
          left: 0;
          width: 100%;
          height: calc(100vh - 80px);
          flex-direction: column;
          justify-content: flex-start;
          align-items: flex-end;
          gap: 1.2rem;
          padding-top: 1.2rem;
          padding-right: 3rem;
          transform: translateX(100%);
          transition: transform 0.3s ease;
          z-index: 1002;
        }

        .page-content .nav-links.active {
          transform: translateX(0);
        }

        .page-content .nav-links li {
          margin: 0;
          padding-right: 0;
        }

        .page-content .nav-links li:not(.lang-item) {
          margin-right: 0;
        }

        .page-content .nav-links a {
          font-size: 18px;
          padding: 10px 0px 10px 18px;
        }

        .lang-item {
          margin-left: 0 !important;
          padding-right: 0 !important;
          flex-direction: column;
          align-items: flex-end;
          gap: 1.2rem;
        }

        .lang-item .lang-switcher {
          flex-direction: row;
          gap: 0.28rem;
          margin-right: -7px;
        }

        .page-content .nav-links .lang-switcher a {
          font-size: 18px;
          padding: 2.5px 7px 1.5px 7px;
        }

        footer {
          padding: 1rem 1.5rem;
        }

        .footer-inner {
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 0.5rem;
        }

        .footer-links {
          justify-content: center;
        }
      }

      .page-content .nav-links a:hover {
        color: #00906A;
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 2px;
      }

      .lang-switcher {
        display: flex;
        gap: 0.05rem;
        align-items: center;
        position: relative;
      }

      .lang-slider {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        background: #00906A;
        border-radius: 4px;
        transition: transform 0.25s ease, width 0.25s ease;
        pointer-events: none;
      }

      .lang-item {
        margin-left: 0 !important;
        display: flex;
        align-items: center;
        gap: 1.5rem;
      }

      .sun-icon {
        display: block;
        flex-shrink: 0;
      }

      /* Mobile icon hidden on desktop */
      #theme-icon {
        display: none;
      }

      @media (max-width: 768px) {
        /* Show mobile icon, hide desktop icon */
        #theme-icon { display: block; }
        .sun-icon-desktop { display: none; }
      }

      .lang-switcher a {
        color: #00906A;
        text-decoration: none;
        font-size: 18px;
        font-weight: 400;
        padding: 2.5px 7px 1.5px 7px;
        border-radius: 4px;
        transition: color 0.25s ease;
        position: relative;
        z-index: 1;
      }

      .lang-switcher a:hover {
        text-decoration: none;
      }

      .lang-switcher a.lang-active,
      .lang-switcher a.lang-active:hover {
        color: #fff;
      }
    </style>
    <script src="script.js" defer></script>
  </head>

          </div>
          <ul class="nav-links" id="nav-links">
            <li><a href="#contact">Contact</a></li>
            <li><a href="#about">About</a></li>
