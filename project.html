    <script>
      // ── Populate page from PROJECTS data ──────────────────────
      (function () {
        const id = new URLSearchParams(window.location.search).get('id');
        // Object.hasOwn (not just `id && PROJECTS[id]`) so a crafted URL like
        // ?id=__proto__ or ?id=constructor can't resolve to Object.prototype /
        // the Object constructor instead of hitting the "not found" branch.
        const project = id && Object.hasOwn(PROJECTS, id) ? PROJECTS[id] : null;

        if (!project) {
          document.getElementById('project-title').textContent = 'Project not found';
          return;
        }

        // Page title
        document.title = project.title + ' — Hannes Oberparleiter';

        // Meta description + Open Graph tags (falls back to a generic
        // line for projects with no body text, e.g. image-only pieces)
        (function () {
          const firstParagraph = (() => {
            if (Array.isArray(project.body)) return project.body[0];
            const localized = project.body?.en || Object.values(project.body || {})[0];
            return localized?.[0];
          })();
          const desc = firstParagraph
            ? (firstParagraph.length > 155 ? firstParagraph.slice(0, 152) + '…' : firstParagraph)
            : `${project.title} — a ${project.category.replace('-', ' & ')} project by Hannes Oberparleiter, ${project.year}.`;
          const ogTitle = project.title + ' — Hannes Oberparleiter';
          const heroImage = Array.isArray(project.hero) ? project.hero[0] : null;

          document.getElementById('meta-description')?.setAttribute('content', desc);
          document.getElementById('og-title')?.setAttribute('content', ogTitle);
          document.getElementById('og-description')?.setAttribute('content', desc);
          if (heroImage) {
            document.getElementById('og-image')?.setAttribute(
              'content', new URL(heroImage, window.location.href).href
            );
          }
        })();

        // H1
        document.getElementById('project-title').textContent = project.title;

        // Body paragraphs — supports either a plain array (single language)
        // or an { en, de, it } object (localized per project). A trailer
        // link is appended at the end if the project has one.
        const getBodyParagraphs = () => {
          if (Array.isArray(project.body)) return project.body;
          const lang = (typeof currentLang !== 'undefined' && currentLang) || 'en';
          return project.body[lang] || project.body.en || Object.values(project.body)[0] || [];
        };

        // Everything on this page that depends on the current language —
        // called once on load and again whenever the switcher is used.
        const applyProjectLocalization = () => {
          // Category + year
          document.getElementById('project-meta').innerHTML =
            t('tab.' + project.category) + '<span class="meta-divider"></span>' + project.year;

          // Body (no trailer link here anymore — it now sits next to the title)
          document.getElementById('project-body').innerHTML =
            getBodyParagraphs().map(p => `<p class="project-body">${p}</p>`).join('');

          // Watch Trailer button — next to the title
          const watchBtn = document.getElementById('watch-trailer-btn');
          if (project.youtube) {
            watchBtn.href = `https://www.youtube.com/watch?v=${project.youtube}`;
            watchBtn.querySelector('.trailer-link-text').textContent = t('project.watchTrailer');
            watchBtn.style.display = 'inline-flex';
          }

          // Slideshow placeholder labels ("Image 1", "Bild 1", …)
          document.querySelectorAll('#project-hero .placeholder-label').forEach(el => {
            el.textContent = `${t('project.image')} ${el.dataset.num}`;
          });
        };

        applyProjectLocalization();

        // Re-run localization on language switch, without breaking the
        // slider-position hook project-nav.js sets. project-nav.js is a
        // deferred script, so it only runs after this inline script — we
        // must wait for DOMContentLoaded before wrapping its hook, otherwise
        // project-nav.js would overwrite ours right after.
        document.addEventListener('DOMContentLoaded', () => {
          const prevOnLangChange = window.__onLangChange;
          window.__onLangChange = (link) => {
            if (typeof prevOnLangChange === 'function') prevOnLangChange(link);
            applyProjectLocalization();
          };
        });

        // Credits — horizontal divider + name/role rows (only if the
        // project has a `credits` list; the old client/year/role/tools
        // list has been removed everywhere)
        const creditsWrap = document.getElementById('project-credits-wrap');
        if (Array.isArray(project.credits) && project.credits.length) {
          creditsWrap.innerHTML =
            '<hr class="project-credits-divider">' +
            '<div class="project-credits">' +
            project.credits.map(c =>
              `<div class="credit-row"><span class="credit-role">${c.role}:</span> <span class="credit-name">${c.name}</span></div>`
            ).join('') +
            '</div>';
        }

        // ── Slideshow ──────────────────────────────────────────
        const heroWrap  = document.getElementById('project-hero');

        // Build slide list from the hero images (poster included, no link)
        const heroArr = Array.isArray(project.hero) ? project.hero : (project.hero ? [project.hero] : [null]);
        const slides = heroArr.map((src, i) => ({ type: src ? 'img' : 'placeholder', src, index: i }));

        if (slides.length === 0) slides.push({ type: 'placeholder', index: 0 });

        // Create track element — slides sit left-aligned, side by side at equal height
        const track = document.createElement('div');
        track.className = 'slideshow-track';
        heroWrap.appendChild(track);

        // ── Fullscreen lightbox for clicking an image ──────────
        const imgSlides = slides.filter(s => s.type === 'img');
        let lightboxEl    = null;
        let lightboxIndex = 0;

        const showLightboxImage = (index) => {
          if (!imgSlides.length) return;
          lightboxIndex = (index + imgSlides.length) % imgSlides.length;
          const img = lightboxEl.querySelector('img');
          img.decoding = 'async';
          img.src = imgSlides[lightboxIndex].src;
          img.alt = project.title;
          lightboxEl.classList.toggle('single', imgSlides.length < 2);
        };

        const openLightbox = (index) => {
          if (!lightboxEl) {
            lightboxEl = document.createElement('div');
            lightboxEl.className = 'project-lightbox';
            lightboxEl.innerHTML = `
              <img alt="">
              <div class="lightbox-nav-row">
                <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous image">
                  <svg width="14" height="22" viewBox="0 0 10 16" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="9,1 1,8 9,15" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button type="button" class="lightbox-nav lightbox-next" aria-label="Next image">
                  <svg width="14" height="22" viewBox="0 0 10 16" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="1,1 9,8 1,15" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            `;
            // Clicking the backdrop or the image closes; clicking a nav
            // arrow navigates instead (stopPropagation keeps it open).
            lightboxEl.addEventListener('click', (e) => {
              if (e.target.closest('.lightbox-nav')) return;
              closeLightbox();
            });
            lightboxEl.querySelector('.lightbox-prev').addEventListener('click', (e) => {
              e.stopPropagation();
              showLightboxImage(lightboxIndex - 1);
            });
            lightboxEl.querySelector('.lightbox-next').addEventListener('click', (e) => {
              e.stopPropagation();
              showLightboxImage(lightboxIndex + 1);
            });
            document.addEventListener('keydown', e => {
              if (!lightboxEl.classList.contains('open')) return;
              if (e.key === 'Escape')    closeLightbox();
              if (e.key === 'ArrowLeft')  showLightboxImage(lightboxIndex - 1);
              if (e.key === 'ArrowRight') showLightboxImage(lightboxIndex + 1);
            });

            // Swipe left/right to navigate on touch devices.
            let touchStartX = 0, touchStartY = 0;
            lightboxEl.addEventListener('touchstart', (e) => {
              touchStartX = e.touches[0].clientX;
              touchStartY = e.touches[0].clientY;
            }, { passive: true });
            lightboxEl.addEventListener('touchend', (e) => {
              const dx = e.changedTouches[0].clientX - touchStartX;
              const dy = e.changedTouches[0].clientY - touchStartY;
              if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
                showLightboxImage(lightboxIndex + (dx < 0 ? 1 : -1));
              }
            }, { passive: true });

            document.body.appendChild(lightboxEl);
          }

          showLightboxImage(index);
          lightboxEl.classList.add('open');

          // Lock background scroll WITHOUT changing body's width — hiding the
          // scrollbar shifts body width, which otherwise triggers the canvas
          // resize/redraw right as the lightbox tries to fade in (the lag).
          const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
          document.body.style.overflow = 'hidden';
          if (scrollbarWidth > 0) document.body.style.paddingRight = scrollbarWidth + 'px';
        };
        const closeLightbox = () => {
          if (!lightboxEl) return;
          lightboxEl.classList.remove('open');
          document.body.style.overflow = '';
          document.body.style.paddingRight = '';
        };

        slides.forEach((s, i) => {
          let el;
          if (s.type === 'img') {
            el = document.createElement('div');
            el.className = 'slideshow-slide';
            const lazyAttr = i === 0 ? '' : ' loading="lazy"';
            el.innerHTML = `<img src="${s.src}" alt="${project.title}"${lazyAttr}>`;
            const imgIndex = imgSlides.indexOf(s);
            el.addEventListener('click', () => openLightbox(imgIndex));
          } else {
            el = document.createElement('div');
            el.className = 'slideshow-slide slideshow-placeholder';
            el.innerHTML = `<span class="placeholder-label" data-num="${s.index + 1}">${t('project.image')} ${s.index + 1}</span>`;
          }
          el.dataset.index = i;
          track.appendChild(el);
        });

      })();
    </script>
